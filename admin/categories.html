<title>หมวดหมู่ · หลังบ้าน MAHASART</title>

      <h1>หมวดหมู่</h1>

  <div class="tabs" role="tablist" aria-label="ประเภทหมวดหมู่">
    <button type="button" role="tab" id="tab-article" data-type="article" aria-selected="true" aria-controls="panel">บทความ</button>
    <button type="button" role="tab" id="tab-amulet" data-type="amulet" aria-selected="false" aria-controls="panel" tabindex="-1">วัตถุมงคล</button>
