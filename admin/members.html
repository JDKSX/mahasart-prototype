<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สมาชิก · หลังบ้าน MAHASART</title>
<!-- ลบ noindex ตอนเปิดระบบจริง -->
<meta name="robots" content="noindex,nofollow">

<body data-admin-page="members" data-perm="members.view" data-base="../">
<div id="mh-admin"></div>
<main id="main" class="adm-main">
  <div class="adm-head">
    <div>
      <h1>สมาชิก</h1>
      <p>รายชื่อสมาชิกเว็บ ดูสถานะ แพ็กเกจ และระงับบัญชีที่มีปัญหา · ไม่แสดงวันเกิดในตารางนี้</p>
    </div>
  </div>
  <div class="toolbar mb-toolbar" role="search" aria-label="กรองรายชื่อสมาชิก">
    <div class="field tb-search"><label for="f-q">ค้นหา</label><input class="input" id="f-q" type="search" placeholder="ชื่อหรืออีเมล" autocomplete="off"></div>
    <div class="field"><label for="f-provider">ช่องทางสมัคร</label><select class="select" id="f-provider"></select></div>
    <div class="field"><label for="f-plan">แพ็กเกจ</label><select class="select" id="f-plan"></select></div>
    <div class="field"><label for="f-status">สถานะ</label><select class="select" id="f-status"></select></div>
  </div>
  <p class="mb-count" id="mb-count" role="status" aria-live="polite"></p>
  <div id="list"></div>
</main>
<script src="../data/rules.js"></script>
