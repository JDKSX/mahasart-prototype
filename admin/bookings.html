<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>การนัดหมาย · หลังบ้าน MAHASART</title>
<!-- ลบ noindex ตอนเปิดระบบจริง -->
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/css/mahasart-ds.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/admin-pages.css">
<link rel="stylesheet" href="../assets/css/experts.css">
</head>
<body data-admin-page="bookings" data-perm="bookings.view|bookings.view_own" data-base="../">
<div id="mh-admin"></div>
<main id="main" class="adm-main">
  <div class="adm-head">
    <div><h1>การนัดหมาย</h1><p id="scope-note">นัดผู้เชี่ยวชาญทั้งหมด</p></div>
  </div>
  <div id="notes" class="notice-stack"></div>
  <div class="toolbar" role="search" aria-label="กรองการนัดหมาย">
    <div class="field tb-search">
      <label class="sr-only" for="f-q">ค้นหาจากเลขที่นัดหรือชื่อสมาชิก</label>
      <input class="input" id="f-q" type="search" placeholder="ค้นหาเลขที่นัดหรือชื่อสมาชิก" autocomplete="off">
    </div>
    <div class="field" id="f-expert-wrap">
      <label class="sr-only" for="f-expert">กรองตามผู้เชี่ยวชาญ</label>
      <select class="select" id="f-expert"><option value="">ทุกผู้เชี่ยวชาญ</option></select>
    </div>
    <div class="field">
      <label class="sr-only" for="f-from">นัดตั้งแต่วันที่</label>
      <input class="input" id="f-from" type="date" aria-label="นัดตั้งแต่วันที่">
    </div>
    <div class="field">
      <label class="sr-only" for="f-to">นัดถึงวันที่</label>
      <input class="input" id="f-to" type="date" aria-label="นัดถึงวันที่">
    </div>
    <button type="button" class="btn btn--outline" id="f-clear" hidden>ล้างตัวกรอง</button>
  </div>
  <div class="chips" id="status-chips" role="group" aria-label="กรองตามสถานะ"></div>
  <p class="muted result-count" id="result-count" role="status" aria-live="polite"></p>
  <div id="list"></div>
</main>
<script src="../data/rules.js"></script>
<script src="../data/content.js"></script>
<script src="../data/system.js"></script>
<script src="../data/phase2.js"></script>
<script src="../data/phase3.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/commerce.js"></script>
<script src="../assets/js/astro.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/admin/admin-shell.js"></script>
<script src="../assets/js/admin/bookings.js"></script>
</body>
</html>
